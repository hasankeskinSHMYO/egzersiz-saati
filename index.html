<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Egzersiz">
<meta name="theme-color" content="#0a0f2e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Egzersiz Saati</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  html, body { margin: 0; height: 100%; background: #0a0f2e; background-image: linear-gradient(160deg, #0a0f2e 0%, #1c1b6b 100%); color: #f0f4ff; font-family: -apple-system, Helvetica, Arial, sans-serif; overflow: hidden; }
  button { font-size: 3.6vmin; padding: 1.2vmin 2.6vmin; border-radius: 99px; border: 0; background: #2f3f8f; color: #fff; }
  button.go { background: #0fae6e; } button.stop { background: #e11d48; }
  svg { width: 100%; height: 100%; }
  #app { position: absolute; inset: 0; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 2.5vmin;
    padding: env(safe-area-inset-top) max(2vw, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 5vmin) max(2vw, env(safe-area-inset-left)); }

  /* SOL: analog + dijital + planlanan bitis */
  #left { flex: none; display: flex; flex-direction: column; align-items: center; gap: .8vmin; }
  #clock { width: 46vmin; height: 46vmin; }
  #wx { align-self: flex-start; text-align: left; font-size: 3.4vmin; line-height: 1.25; min-height: 8vmin; color: #c7d2fe; } #wx b { display: block; font-size: 4.6vmin; color: #fff; font-weight: 600; }

  /* ORTA */
  #mid { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1.2vmin; }
  #cd { font-size: 19vmin; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: #19f0a0; }
  #cd.rest { color: #35b6ff; } #cd.warn { color: #ff3d6e; } #cd.warnRest { color: #ffc21a; }
  #phase { font-size: 3.6vmin; opacity: .85; text-align: center; }
  #audioWarn { display: none; background: #e11d48; border-radius: 99px; padding: .6vmin 2.4vmin; font-size: 3vmin; }
  #info { font-size: 4vmin; font-weight: 600; color: #ffd84d; }
  #btnRow { display: flex; gap: 2vmin; }
  button.pause { background: #ea7a0a; }
  #stats { width: 100%; max-width: 46vw; background: rgba(99,102,241,.30); border-radius: 5vmin; padding: .8vmin 2vmin; display: flex; align-items: center; justify-content: space-around; gap: 1vmin; }
  #stats .side { display: flex; flex-direction: column; align-items: center; min-width: 11vmin; }
  #stats .side small { font-size: 2.4vmin; opacity: .7; }
  #stats .side b { font-size: 16vmin; line-height: 1.1; font-variant-numeric: tabular-nums; }
  #stats .side.small b { font-size: 8vmin; color: #19f0a0; }
  #timerRow { display: flex; flex-wrap: wrap; justify-content: center; column-gap: 3.4vmin; row-gap: .4vmin; font-variant-numeric: tabular-nums; }
  #timerRow .tr { display: inline-flex; align-items: baseline; gap: 1vmin; white-space: nowrap; }
  #timerRow small { font-size: 3vmin; opacity: .75; font-weight: 400; color: #c7d2fe; }
  #timerRow b { font-size: 5vmin; font-weight: 600; color: #ffd84d; }

  /* SAG: ayarlar */
  #side { flex: none; display: flex; flex-direction: column; gap: .9vmin; max-height: 100%; overflow-y: auto; padding: 1vmin 0; }
  .adj { display: flex; align-items: center; justify-content: space-between; gap: 1vmin; font-size: 3vmin; }
  .adj span { opacity: .9; min-width: 24vmin; text-align: center; }
  .adj button { font-size: 3.6vmin; padding: .6vmin 2vmin; }


  @media (orientation: portrait) {
    #app { flex-direction: column; justify-content: flex-start; gap: 1.5vh; padding-top: calc(env(safe-area-inset-top) + 4vh); padding-bottom: 7vh; overflow-y: auto; }
    #clock { width: 52vw; height: 52vw; } #wx { font-size: 3.8vw; min-height: 11vw; } #wx b { font-size: 5.4vw; }
    #cd { font-size: 24vw; } #phase { font-size: 4.4vw; } #info { font-size: 5vw; }
    #stats { max-width: 92vw; } #stats .side b { font-size: 22vw; } #stats .side small { font-size: 3vw; }
    #stats .side.small b { font-size: 10vw; }
    #stats .side { min-width: 18vw; } #timerRow small { font-size: 4vw; } #timerRow b { font-size: 6.4vw; }
    button { font-size: 4.6vw; padding: 2vw 4.4vw; }
    #side { width: 92vw; max-height: none; overflow: visible; }
    .adj { font-size: 4vw; } .adj span { min-width: 38vw; } .adj button { font-size: 5vw; padding: 1.2vw 3.6vw; }
    }
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="wx"></div>
    <div id="clock"></div>
  </div>

  <div id="mid">
    <div id="cd">20</div>
    <div id="phase">Hazır</div>
    <div id="audioWarn">Ses kesildi: ekrana bir kez dokun</div>
    <div id="info">Hareket <span id="moveNow">0</span> / <span id="moveTotal">7</span></div>
    <div id="btnRow"><button id="startBtn" class="go">Başlat</button><button id="resetBtn">Sıfırla</button></div>
    <div id="stats">
      <span class="side"><small>SET</small><b id="setNow">0</b></span>
      <span class="side small"><small>YAPILAN SET</small><b id="doneNow">0</b></span>
    </div>
    <div id="timerRow"><span class="tr"><small>Geçen süre</small><b id="timer">00:00</b></span><span class="tr"><small id="endLbl">Planlanan bitiş</small><b id="endTime">--:--</b></span></div>
  </div>

  <div id="side">
    <div class="adj"><button data-k="work" data-d="-5">− 5</button><span>Egzersiz: <b id="v_work"></b> sn</span><button data-k="work" data-d="5">+ 5</button></div>
    <div class="adj"><button data-k="rest" data-d="-1">− 1</button><span>Mola: <b id="v_rest"></b> sn</span><button data-k="rest" data-d="1">+ 1</button></div>
    <div class="adj"><button data-k="sets" data-d="-1">− 1</button><span>Set: <b id="v_sets"></b></span><button data-k="sets" data-d="1">+ 1</button></div>
    <div class="adj"><button data-k="moves" data-d="-1">− 1</button><span>Hareket: <b id="v_moves"></b></span><button data-k="moves" data-d="1">+ 1</button></div>
    <div class="adj"><button data-k="moveRest" data-d="-5">− 5</button><span>Hareket arası: <b id="v_moveRest"></b> sn</span><button data-k="moveRest" data-d="5">+ 5</button></div>
    <button id="voiceBtn">Konuşma: kapalı</button>
    <button id="soundBtn" class="go">Ses: açık</button>
  </div>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');

/* ---------- Analog kadran ---------- */
function makeClock(container) {
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '-100 -100 200 200');
  const add = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; };
  add('circle', {r: 96, fill: '#101a45', stroke: '#3d56c8', 'stroke-width': 2});
  const ring = add('circle', {r: 98, fill: 'none', stroke: '#19f0a0', 'stroke-width': 4, 'stroke-linecap': 'round',
    transform: 'rotate(-90)', 'stroke-dasharray': '0 1000', opacity: 0});
  for (let i = 0; i < 60; i++) {
    const a = i * 6 * Math.PI / 180, big = i % 5 === 0, r1 = big ? 80 : 86, r2 = 92;
    add('line', {x1: Math.sin(a)*r1, y1: -Math.cos(a)*r1, x2: Math.sin(a)*r2, y2: -Math.cos(a)*r2, stroke: big ? '#fff' : '#8da2ff', 'stroke-width': big ? 2.4 : 1});
  }
  for (let n = 1; n <= 12; n++) {
    const a = n * 30 * Math.PI / 180;
    const t = add('text', {x: Math.sin(a)*66, y: -Math.cos(a)*66, fill: '#fff', 'font-size': 13, 'text-anchor': 'middle', 'dominant-baseline': 'central'});
    t.textContent = n;
  }
  const hh = add('line', {x1: 0, y1: 6, x2: 0, y2: -48, stroke: '#ffffff', 'stroke-width': 5, 'stroke-linecap': 'round'});
  const mm = add('line', {x1: 0, y1: 8, x2: 0, y2: -72, stroke: '#ffffff', 'stroke-width': 3.5, 'stroke-linecap': 'round'});
  const ss = add('g', {});
  add('line', {x1: 0, y1: 18, x2: 0, y2: -82, stroke: '#ff7a1a', 'stroke-width': 1.8, 'stroke-linecap': 'round'}, ss);
  add('circle', {r: 3.5, fill: '#ff7a1a'}, ss);
  add('circle', {r: 1.6, fill: '#101a45'});
  container.appendChild(svg);
  return {hh, mm, ss, ring};
}
const clock = makeClock($('clock'));
const RING_LEN = 2 * Math.PI * 98;
function setRing(frac, color) {
  clock.ring.setAttribute('opacity', frac === null ? 0 : 1);
  if (frac !== null) { clock.ring.setAttribute('stroke-dasharray', (RING_LEN * frac) + ' ' + RING_LEN); clock.ring.setAttribute('stroke', color); }
}

/* ---------- Ses: sadece Web Audio (bip). Konusma yok, mikrofon yok => ses kesilmez ---------- */
/* sessiz dongu: uygulama arka plana gecince/ekran kilitlenince sayaci ve sesi canli tutar */
const keepAudio = new Audio(); keepAudio.loop = true; keepAudio.setAttribute('playsinline', '');
(function () {
  const n = 8000, b = new Uint8Array(44 + n), dv = new DataView(b.buffer), w = (o, t) => [...t].forEach((c, i) => b[o + i] = c.charCodeAt(0));
  w(0, 'RIFF'); dv.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, 8000, true); dv.setUint32(28, 8000, true); dv.setUint16(32, 1, true); dv.setUint16(34, 8, true); w(36, 'data'); dv.setUint32(40, n, true);
  b.fill(128, 44); keepAudio.src = URL.createObjectURL(new Blob([b], {type: 'audio/wav'}));
})();
let soundOn = true, ac = null, lastRebuild = 0;
function buildAudio() {
  try { if (ac) ac.close().catch(() => {}); } catch (e) {}
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const me = ac;
  // alarm/arama gibi kesintilerden sonra kendiliginden geri donmeyi dene
  me.onstatechange = () => { if (ac === me && me.state !== 'running' && me.state !== 'closed') me.resume().catch(() => {}); };
  // sessiz surekli osilator: ses oturumunu canli tutar
  const o = me.createOscillator(), g = me.createGain();
  g.gain.value = 0.00001; o.connect(g); g.connect(me.destination); o.start();
  lastRebuild = Date.now();
}
function ensureAudio(gesture) {
  try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch (e) {} // muzikle birlikte calsin
  try {
    if (!ac || ac.state === 'closed') buildAudio();
    if (ac.state !== 'running') {
      ac.resume().catch(() => {});
      // dokunusla geri getirme: resume islemezse (alarm sonrasi 'interrupted') sesi bastan kur
      if (gesture) {
        const c = ac;
        setTimeout(() => {
          if (ac === c && c.state !== 'running' && Date.now() - lastRebuild > 1200) { buildAudio(); ac.resume().catch(() => {}); }
        }, 350);
      }
    }
  } catch (e) {}
}
function beep(freq, dur, vol, type) {
  if (!soundOn) return;
  ensureAudio(false);
  try {
    const t = ac.currentTime + 0.02, o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.6, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
['touchstart', 'touchend', 'pointerdown', 'click'].forEach(ev => document.addEventListener(ev, () => ensureAudio(true), {passive: true}));
['focus', 'pageshow'].forEach(ev => window.addEventListener(ev, () => ensureAudio(false)));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    ensureAudio(false); keepAwake();
    if (run && !paused && keepAudio.paused) keepAudio.play().catch(() => {});
  }
});
setInterval(() => {
  if (ac && ac.state !== 'running') ensureAudio(false);
  $('audioWarn').style.display = (soundOn && run && !paused && ac && ac.state !== 'running') ? 'block' : 'none';
}, 1000);

$('soundBtn').onclick = () => {
  soundOn = !soundOn;
  $('soundBtn').textContent = soundOn ? 'Ses: açık' : 'Ses: kapalı';
  $('soundBtn').className = soundOn ? 'go' : '';
  if (soundOn) beep(880, 0.15);
};

/* ---------- Konusma: varsayilan KAPALI (bip sesli); acilirsa kadin sesiyle ---------- */
let voiceOn = false, trVoice = null;
try { voiceOn = localStorage.getItem('egz-voice') === '1'; } catch (e) {}
let voiceFemale = false;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices().filter(v => /^tr/i.test(v.lang));
    const female = /emel|yelda|filiz|seda|zira|google|female|kad[ıi]n|natural/i, male = /tolga|cem\b|ahmet|kerem|erkek|\bmale\b/i;
    // sira: bilinen kadin sesi -> erkek olmayan Turkce ses -> eldeki herhangi Turkce ses
    trVoice = vs.find(v => female.test(v.name) && !male.test(v.name)) || vs.find(v => !male.test(v.name)) || vs[0] || null;
    voiceFemale = !!trVoice && female.test(trVoice.name) && !male.test(trVoice.name);
  } catch (e) {}
}
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
function speak(text) {
  if (!voiceOn || !soundOn || !('speechSynthesis' in window)) return;
  try {
    pickVoice(); // ses listesi gec yuklenebilir (Chrome/Edge)
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'tr-TR'; if (trVoice) u.voice = trVoice; u.rate = 1; u.volume = 1;
    u.pitch = voiceFemale ? 1.05 : 1.5; // kadin ses bulunamazsa tonu yukseltip kadina yaklastir
    u.onend = () => ensureAudio(false);
    speechSynthesis.speak(u);
  } catch (e) {}
}
function showVoiceBtn() {
  $('voiceBtn').textContent = voiceOn ? 'Konuşma: açık' : 'Konuşma: kapalı';
  $('voiceBtn').className = voiceOn ? 'go' : '';
}
$('voiceBtn').onclick = () => {
  voiceOn = !voiceOn; showVoiceBtn();
  try { localStorage.setItem('egz-voice', voiceOn ? '1' : '0'); } catch (e) {}
  if (voiceOn) { pickVoice(); speak('Konuşma açık'); }
};
showVoiceBtn();

/* ---------- Ayarlar ---------- */
let cfg = {work: 20, rest: 10, sets: 10, moves: 7, moveRest: 20};
const MIN = {work: 5, rest: 1, sets: 1, moves: 1, moveRest: 5};
try { Object.assign(cfg, JSON.parse(localStorage.getItem('egz-cfg2') || '{}')); } catch (e) {}
function showCfg() {
  for (const k in cfg) $('v_' + k).textContent = cfg[k];
  $('moveTotal').textContent = cfg.moves;
  try { localStorage.setItem('egz-cfg2', JSON.stringify(cfg)); } catch (e) {}
  if (!run) showIdle();
}
document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
  if (run) return;
  const k = b.dataset.k; cfg[k] = Math.max(MIN[k], cfg[k] + Number(b.dataset.d)); showCfg();
});

/* ---------- Program: hareketler x setler ---------- */
let doneSets = 0;
function setDone(n) { doneSets = n; $('doneNow').textContent = n; }
let segs = [], si = 0, run = false, paused = false, pausedLeftMs = 0, pausedElapsed = 0, segEnd = 0, lastShown = -1, t0 = 0;

function buildSegs() {
  const out = [];
  for (let m = 1; m <= cfg.moves; m++) {
    for (let s = 1; s <= cfg.sets; s++) {
      out.push({type: 'work', dur: cfg.work, m, s});
      const lastSet = s === cfg.sets, lastMove = m === cfg.moves;
      if (lastSet && lastMove) break;
      if (lastSet) out.push({type: 'moveRest', dur: cfg.moveRest, m, s});
      else out.push({type: 'rest', dur: cfg.rest, m, s});
    }
  }
  return out;
}
function totalSeconds() { return buildSegs().reduce((a, g) => a + g.dur, 0); }


function applySeg() {
  const g = segs[si];
  segEnd = Date.now() + g.dur * 1000; lastShown = -1;
  const cd = $('cd'); cd.className = g.type === 'work' ? '' : 'rest';
  const nextMove = g.type === 'moveRest' ? g.m + 1 : g.m;
  $('moveNow').textContent = nextMove;
  if (g.type === 'work') { $('phase').textContent = 'Egzersiz'; $('setNow').textContent = g.s; }
  else if (g.type === 'rest') { $('phase').textContent = 'Mola'; }
  else { $('phase').textContent = 'Hareket arası — sonraki hareket'; $('setNow').textContent = 0; }
}
function showIdle() {
  $('cd').className = ''; $('cd').textContent = cfg.work; $('phase').textContent = 'Hazır';
  $('moveNow').textContent = 0; $('setNow').textContent = 0; setRing(null);
  $('timer').textContent = '00:00';
}
function setEndFromRemaining() {
  let remain = (paused ? pausedLeftMs : Math.max(0, segEnd - Date.now())) / 1000;
  for (let i = si + 1; i < segs.length; i++) remain += segs[i].dur;
  const e = new Date(Date.now() + remain * 1000);
  $('endLbl').textContent = 'Planlanan bitiş';
  $('endTime').textContent = pad(e.getHours()) + ':' + pad(e.getMinutes()) + ':' + pad(e.getSeconds());
}
function clearEnd() { $('endLbl').textContent = 'Planlanan bitiş'; $('endTime').textContent = '--:--'; }

function setBtn() {
  const b = $('startBtn');
  if (!run) { b.textContent = 'Başlat'; b.className = 'go'; }
  else if (!paused) { b.textContent = 'Duraklat'; b.className = 'pause'; }
  else { b.textContent = 'Devam'; b.className = 'go'; }
}
$('startBtn').onclick = () => {
  ensureAudio(true); keepAwake();
  if (!run) {
    segs = buildSegs(); si = 0; run = true; paused = false; t0 = Date.now(); setDone(0);
    applySeg(); setEndFromRemaining(); beep(1200, 0.4); keepAudio.play().catch(() => {}); setTimeout(() => announce(segs[0]), 700);
  } else if (!paused) {
    paused = true; pausedLeftMs = Math.max(0, segEnd - Date.now()); pausedElapsed = Date.now() - t0;
    beep(500, 0.2); keepAudio.pause();
    $('endLbl').textContent = 'Duraklatıldı'; $('endTime').textContent = '--:--';
  } else {
    paused = false; segEnd = Date.now() + pausedLeftMs; t0 = Date.now() - pausedElapsed; lastShown = -1;
    beep(900, 0.2); keepAudio.play().catch(() => {}); setEndFromRemaining();
  }
  setBtn();
};
$('resetBtn').onclick = () => {
  run = false; paused = false; setBtn(); showIdle(); setDone(0); clearEnd(); keepAudio.pause(); try { speechSynthesis.cancel(); } catch (e) {}
};

const NOTES = [523, 587, 659, 698, 784, 880, 988, 1047, 1175, 1319]; // her set farkli nota
function announce(g) {
  if (g.type === 'work') speak(g.s === 1 ? 'Hareket ' + g.m + '. Set 1' : 'Set ' + g.s);
  else if (g.type === 'moveRest') speak('Hareket arası dinlenme');
  else speak('Mola');
}
function startTone(g) {
  if (g.type === 'work') { const n = NOTES[(g.s - 1) % NOTES.length]; beep(n, 0.22); setTimeout(() => beep(n, 0.22), 300); if (g.s === 1) setTimeout(() => beep(n * 1.5, 0.3), 600); }
  else { beep(400, 0.3, 0.5, 'triangle'); }
}
function logic() {
  const now = Date.now();
  if (run && !paused) {
    const g = segs[si], leftMs = Math.max(0, segEnd - now), left = Math.ceil(leftMs / 1000);
    const warn = left <= 3 && left >= 1;
    setRing(leftMs / (g.dur * 1000), g.type === 'work' ? (warn ? '#ff3d6e' : '#19f0a0') : (warn ? '#ffc21a' : '#35b6ff'));
    if (left !== lastShown) {
      lastShown = left; $('cd').textContent = left;
      $('cd').className = ((g.type === 'work' ? '' : 'rest') + (warn ? (g.type === 'work' ? ' warn' : ' warnRest') : '')).trim();
      if (warn) { if (g.type === 'work') beep(880, 0.14); else beep(520, 0.22, 0.7, 'triangle'); } // egzersiz: kirmizi + ince bip, mola: sari + kalin bip
    }
    $('timer').textContent = fmt(now - t0);
    if (now >= segEnd) {
      if (g.type === 'work' && g.s === cfg.sets) setDone(g.m); // tum setler bitti: 1 set yapildi
      if (si >= segs.length - 1) {
        run = false; setRing(null);
        $('cd').className = ''; $('cd').textContent = 'Bitti'; $('phase').textContent = 'Egzersiz bitti';
        setBtn();
        keepAudio.pause();
        beep(1200, 0.4); setTimeout(() => beep(1500, 0.4), 450); setTimeout(() => beep(1800, 0.7), 900); setTimeout(() => speak('Egzersiz bitti'), 1700);
      } else {
        const ended = g.type;
        si++; applySeg();
        if (ended === 'work') beep(1200, 0.6);      // egzersiz bitti: uzun bip
        else startTone(segs[si]);                    // mola bitti: yeni setin notasi
        const nx = segs[si]; setTimeout(() => announce(nx), 700);
      }
    }
  }
}
function fmt(ms) { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return (h ? pad(h) + ':' : '') + pad(m) + ':' + pad(s % 60); }
setInterval(logic, 100); // ekran gorunmese de calissin diye interval

/* ---------- Saat ---------- */
function frame() {
  const d = new Date(), s = d.getSeconds() + d.getMilliseconds() / 1000, m = d.getMinutes() + s / 60, h = (d.getHours() % 12) + m / 60;
  clock.ss.setAttribute('transform', 'rotate(' + s * 6 + ')');
  clock.mm.setAttribute('transform', 'rotate(' + m * 6 + ')');
  clock.hh.setAttribute('transform', 'rotate(' + h * 30 + ')');
  requestAnimationFrame(frame);
}
frame();

/* ---------- Ekran uyanik kalsin ---------- */
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && (!wakeLock || wakeLock.released)) {
    wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
}
keepAwake(); setInterval(keepAwake, 5000);

/* ---------- Konum + sicaklik (Open-Meteo, anahtarsiz) ---------- */
function wxText(c) {
  if (c === 0) return 'Açık'; if (c <= 3) return 'Bulutlu'; if (c === 45 || c === 48) return 'Sisli';
  if (c >= 51 && c <= 67) return 'Yağmurlu'; if (c >= 71 && c <= 77) return 'Karlı'; if (c >= 80 && c <= 82) return 'Sağanak'; if (c >= 95) return 'Fırtına'; return '';
}
function showWx(o) { $('wx').innerHTML = '<b>' + [o.city, Math.round(o.t) + '°C'].filter(Boolean).join(' ') + '</b>' + wxText(o.c); }
try { const old = JSON.parse(localStorage.getItem('egz-wx') || 'null'); if (old) showWx(old); } catch (e) {}
function loadWx() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async pos => {
    try {
      const la = pos.coords.latitude, lo = pos.coords.longitude;
      const w = await (await fetch('https://api.open-meteo.com/v1/forecast?latitude=' + la + '&longitude=' + lo + '&current=temperature_2m,weather_code&timezone=auto')).json();
      let city = '';
      try { const g = await (await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + la + '&longitude=' + lo + '&localityLanguage=tr')).json(); city = g.city || g.locality || g.principalSubdivision || ''; } catch (e) {}
      const o = {city, t: w.current.temperature_2m, c: w.current.weather_code};
      showWx(o); try { localStorage.setItem('egz-wx', JSON.stringify(o)); } catch (e) {}
    } catch (e) {}
  }, () => {}, {maximumAge: 600000, timeout: 10000});
}
loadWx(); setInterval(loadWx, 15 * 60 * 1000);

showCfg();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
